---
area/apps:
  - changed-files:
      - any-glob-to-any-file:
          - apps/**/*
area/github:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**/*
area/mise:
  - changed-files:
      - any-glob-to-any-file:
          - .mise/**/*
area/renovate:
  - changed-files:
      - any-glob-to-any-file:
          - .renovate/**/*
          - .renovaterc.json5
area/tests:
  - changed-files:
      - any-glob-to-any-file:
          - tests/**/*
          - apps/**/*_test.go
          - go.mod
          - go.sum
