---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate

# NOTE: This runs Renovate directly rather than dispatching to a <owner>/.github
# repository the way home-operations upstream does -- this fork has no .github
# repo, and the dispatcher variant fails at token generation with a 404.

on:
  push:
    branches:
      - main
    paths:
      - .renovaterc.json5
      - .renovate/**.json5
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry Run
        default: "false"
        required: false
      logLevel:
        description: Log Level
        default: debug
        required: false
      version:
        description: Renovate version
        default: latest
        required: false
  issues:
    types:
      - edited
  pull_request:
    types:
      - closed
      - edited
  schedule:
    - cron: "0 * * * *" # Every hour

permissions: {}

concurrency:
  group: renovate-${{ github.event.issue.number || github.event.pull_request.number || github.event_name }}
  cancel-in-progress: true

env:
  LOG_LEVEL: "${{ inputs.logLevel || 'debug' }}"
  RENOVATE_AUTODISCOVER: true
  RENOVATE_AUTODISCOVER_FILTER: "${{ github.repository }}"
  RENOVATE_DRY_RUN: "${{ inputs.dryRun == true }}"
  RENOVATE_PLATFORM: github
  RENOVATE_PLATFORM_COMMIT: true
  WORKFLOW_RENOVATE_VERSION: "${{ inputs.version || 'latest' }}"

jobs:
  renovate:
    name: Renovate
    # Dashboard and PR checkbox edits re-trigger Renovate, but only when a human
    # ticked them -- reacting to the bot's own edits would loop.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (
        github.actor != vars.BOT_USERNAME &&
        (
          (
            github.event_name == 'issues' &&
            contains(github.event.issue.title, 'Renovate Dashboard') &&
            (
              contains(github.event.issue.body, '- [x]') ||
              contains(github.event.issue.body, 'approve-all-pending-prs') ||
              contains(github.event.issue.body, 'create-all-rate-limited-prs') ||
              contains(github.event.issue.body, 'rebase-all-open-prs')
            )
          ) ||
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.user.login == vars.BOT_USERNAME &&
            (
              github.event.action == 'closed' ||
              contains(github.event.pull_request.body, '- [x]')
            )
          )
        )
      )
    runs-on: ubuntu-24.04
    steps:
      # Token deliberately inherits the installation's permissions; see the
      # github-app exemption in .github/zizmor.yml for why.
      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: "${{ secrets.BOT_CLIENT_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: "${{ steps.app-token.outputs.token }}"
          persist-credentials: false

      - name: Renovate
        uses: renovatebot/github-action@316d7cd859606d6039a2182b7d69199e9b036835 # v46.2.1
        with:
          configurationFile: .renovaterc.json5
          token: "${{ steps.app-token.outputs.token }}"
          renovate-version: "${{ env.WORKFLOW_RENOVATE_VERSION }}"
